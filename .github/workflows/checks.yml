name: checks

# Every push runs the same harnesses the project runs locally, then builds
# the web export and an Android APK so a broken build is caught here rather
# than on the day someone asks for a link. iOS is exported locally: it
# needs a Mac with Xcode and a signing team either way, so a macOS runner
# would only add cost (see README, "Phones and tablets").

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.7.1

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          set -eux
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot

      - name: Import the project
        # First run builds the class cache and the import metadata the
        # harnesses need; it is expected to be noisy.
        run: godot --headless --editor --quit || true

      - name: Run the checks
        run: dev/run_checks.sh

  web:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and its export templates
        run: |
          set -eux
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "${HOME}/.local/share/godot/export_templates"
          unzip -q templates.tpz
          mv templates "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Import the project
        run: godot --headless --editor --quit || true

      - name: Export for the web
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: td-mania-web
          path: build/web

  android:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and its export templates
        run: |
          set -eux
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "${base}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o templates.tpz "${base}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "${HOME}/.local/share/godot/export_templates"
          unzip -q templates.tpz
          mv templates "${HOME}/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Point Godot at the SDK, the JDK and a debug keystore
        # The runner image ships the Android SDK at ANDROID_HOME. The
        # keystore is throwaway: a debug-signed APK sideloads but cannot
        # go to the store.
        run: |
          set -eux
          keytool -genkeypair -keyalg RSA -validity 9999 \
            -keystore "${HOME}/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "${HOME}/.config/godot"
          cat > "${HOME}/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${HOME}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import the project
        run: godot --headless --editor --quit || true

      - name: Export the APK
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android" "build/android/TD Mania.apk"
          test -s "build/android/TD Mania.apk"

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: td-mania-android
          path: build/android/*.apk
